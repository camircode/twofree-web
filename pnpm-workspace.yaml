# pnpm 11 reads its settings here rather than from .npmrc.

# sharp is left unbuilt on purpose: it is Next's optional image optimiser, this
# application ships one SVG logo, and building it means pulling a prebuilt
# libvips per platform into every image build for nothing.
allowBuilds:
  esbuild: true
  sharp: false

autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@camircode/twofree-application@0.1.0'
  - '@camircode/twofree-auth@0.1.0'
  - '@camircode/twofree-core@0.1.0'
  - '@camircode/twofree-data-provider@0.1.0'
  - '@camircode/twofree-database@0.1.0'
  - '@camircode/twofree-ui@0.1.0'
